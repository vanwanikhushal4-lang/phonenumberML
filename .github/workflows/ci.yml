name: AEGIS-PNP2 Release Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-gates:
    name: Verify Release Gates & Model Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure libphonenumber JAR Exists
        run: |
          mkdir -p ml/evaluation/lib
          if [ ! -f ml/evaluation/lib/libphonenumber-8.13.52.jar ]; then
            curl -L -o ml/evaluation/lib/libphonenumber-8.13.52.jar https://repo1.maven.org/maven2/com/googlecode/libphonenumber/libphonenumber/8.13.52/libphonenumber-8.13.52.jar
          fi

      - name: Run Master CI Release Gate Suite
        run: |
          python scripts/run_ci.py